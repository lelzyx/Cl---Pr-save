<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CLÃ — LELZYX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */

body {

    min-height: 100vh;
    overflow-x: hidden;

    background:
        url("foto.jpg")
        center center
        no-repeat;

    background-size: cover;
    background-color: #000;

    font-family: "Cinzel", Georgia, serif;

}

/* FUNDO */

.overlay {

    position: fixed;
    inset: 0;
    z-index: 1;

    background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.65) 0%,
        rgba(0, 0, 0, 0.40) 40%,
        rgba(0, 0, 0, 0.12) 75%,
        rgba(0, 0, 0, 0.25) 100%
    );

    pointer-events: none;

}

/* CONTEÚDO */

.content {

    position: relative;
    z-index: 2;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;

    padding: 40px 0 45px;

    text-align: center;
    color: white;

    animation: fade 1.5s ease;

}

/* ARTISTA */

.artist {

    font-size: 28px;
    font-weight: 600;
    letter-spacing: 9px;
    margin-bottom: 3px;

    color: #fff;

    text-shadow:
        0 2px 4px #000,
        0 0 12px rgba(255,255,255,.25);

}

/* ÁLBUM */

.album {

    font-size: 70px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 12px;

    color: #fff;

    text-shadow:
        2px 3px 0 #000,
        0 0 8px rgba(255,255,255,.4);

}

/* FRASE DARK */

.frase-dark {

    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    line-height: 1.6;

    max-width: 360px;
    margin: 0 20px 12px;

    color: #b00000;
    text-transform: uppercase;

    text-shadow:
        0 0 4px rgba(255,0,0,.7),
        0 0 12px rgba(120,0,0,.8),
        0 2px 3px #000;

}

/* DIVISOR */

.divisor {

    display: flex;
    align-items: center;
    justify-content: center;

    width: 80%;
    max-width: 380px;

    margin-bottom: 18px;

}

.divisor::before,
.divisor::after {

    content: "";
    height: 1px;
    flex: 1;

    background: linear-gradient(
        to right,
        transparent,
        #9b0000
    );

    box-shadow: 0 0 5px #700000;

}

.divisor::after {

    background: linear-gradient(
        to left,
        transparent,
        #9b0000
    );

}

.divisor span {

    color: #a00000;
    font-size: 20px;
    margin: 0 14px;

    text-shadow: 0 0 8px red;

}

/* DATA */

.date {

    font-size: 22px;
    font-weight: 500;
    letter-spacing: 7px;
    margin-bottom: 8px;

    color: #fff;

}

/* PRÉ-SAVE */

.presave {

    font-size: 15px;
    font-weight: 600;
    letter-spacing: 5px;
    margin-bottom: 12px;

}

/* CONTADOR */

#countdown {

    font-size: 19px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 22px;

    color: white;

    text-shadow:
        0 0 8px rgba(255,255,255,.25);

}

/* BOTÕES */

.btn {

    width: 85%;
    max-width: 400px;

    padding: 17px 25px;

    border-radius: 40px;
    border: 1px solid rgba(255,255,255,.75);

    background: linear-gradient(
        135deg,
        rgba(15,15,15,.98),
        rgba(0,0,0,.98)
    );

    color: white;

    font-family: "Cinzel", Georgia, serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;

    cursor: pointer;
    margin-bottom: 15px;

    transition: .3s;

    box-shadow:
        inset 0 0 15px rgba(255,255,255,.03),
        0 0 10px rgba(0,0,0,.8);

}

/* BOTÃO PRINCIPAL */

.dark-button {

    border-color: #8f0000;

    box-shadow:
        inset 0 0 20px rgba(120,0,0,.25),
        0 0 12px rgba(120,0,0,.35);

}

.btn:hover {

    transform: scale(1.04);

}

/* MÚSICA */

.music {

    font-size: 15px;
    font-weight: 500;
    letter-spacing: 5px;

    margin: 2px 0 12px;

    color: #ddd;

}

/* ANIMAÇÃO */

@keyframes fade {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* CELULAR */

@media(max-width:500px) {

    .artist {
        font-size: 22px;
        letter-spacing: 7px;
    }

    .album {
        font-size: 60px;
    }

    .frase-dark {
        font-size: 13px;
        letter-spacing: 2px;
    }

    .date {
        font-size: 19px;
        letter-spacing: 5px;
    }

    .presave {
        font-size: 13px;
        letter-spacing: 4px;
    }

    #countdown {
        font-size: 16px;
    }

}

</style>

</head>

<body>

<!-- FUNDO -->

<div class="overlay"></div>

<!-- CONTEÚDO PRINCIPAL -->

<div class="content">

    <div class="artist">
        LELZYX
    </div>

    <div class="album">
        CLÃ
    </div>

    <!-- FRASE -->

    <div class="frase-dark">

        NEM TODO ANJO CAIDO É SINAL DE FIM,<br>
        EU SOU O NOVO COMEÇO.

    </div>

    <!-- DIVISOR -->

    <div class="divisor">
        <span>✦</span>
    </div>

    <!-- DATA -->



    <!-- CONTADOR -->

    <div id="countdown"></div>

    <div class="music">
        CLÃ
    </div>

    <!-- BOTÃO DO ÁLBUM -->

    <button
        class="btn"
        onclick="window.open('https://ditto.fm/cla-lelzyx', '_blank')">

        OUÇA AGORA !!!

    </button>

</div>

<!-- CONTADOR -->

<script>

const releaseDate = new Date(
    "Oct 31, 2026 00:00:00"
).getTime();

function updateCountdown() {

    const now = new Date().getTime();

    const distance = releaseDate - now;

    if (distance <= 0) {

        document.getElementById("countdown").innerHTML =
            "✦ JÁ DISPONÍVEL ✦";

        return;

    }

    const d = Math.floor(
        distance / (1000 * 60 * 60 * 24)
    );

    const h = Math.floor(
        (distance / (1000 * 60 * 60)) % 24
    );

    const m = Math.floor(
        (distance / (1000 * 60)) % 60
    );

    const s = Math.floor(
        (distance / 1000) % 60
    );

    document.getElementById("countdown").innerHTML =
        `${d}d : ${h}h : ${m}m : ${s}s`;

}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
